name: publish

# Renders the identity endpoints and the Open Badges 3.0 credential, signs the
# credential, puts it through the 1EdTech validator, and only then deploys.
# Everything personal lives in config.json; badge.json holds the achievement wording.
on:
  push:
    branches: [main]
  schedule:
    - cron: "37 2 * * 1"
  workflow_dispatch:
    inputs:
      identity_only:
        description: >-
          Publish did.json and security.txt only. Needed when the signing key
          changes: a credential signed with the new key cannot validate until
          the document announcing that key is the one being served.
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Signing canonicalises against these. A changed context changes the bytes
      # the signature covers, so verify them before anything reads them.
      - name: Lint workflows
        run: |
          pip install --quiet pyyaml
          python3 scripts/lint-workflows.py

      - name: Verify bundled contexts
        working-directory: contexts
        run: sha256sum -c SHA256SUMS

      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Render identity endpoints
        env:
          DID_ED25519_PRIVATE_B64: ${{ secrets.DID_ED25519_PRIVATE_B64 }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python3 -m pipeline.generate_did_document
          python3 -m pipeline.generate_security_txt
          python3 -m pipeline.generate_humans_txt

      - name: Render credential
        if: inputs.identity_only != true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -m pipeline.generate_badge

      # Guarded like the credential and for the same reason: it is signed. A
      # rotation run publishes the new key by itself, and signs nothing with it.
      - name: Render domain linkage
        if: inputs.identity_only != true
        run: python3 -m pipeline.generate_domain_linkage

      - name: Build signer
        if: inputs.identity_only != true
        run: ./signer/gradlew -p signer --no-daemon -q installDist

      - name: Sign and validate credential
        if: inputs.identity_only != true
        env:
          DID_ED25519_PRIVATE_B64: ${{ secrets.DID_ED25519_PRIVATE_B64 }}
        run: |
          set -o pipefail
          . build/params.env
          ./signer/build/install/signer/bin/signer \
            build/contributions.unsigned.json \
            credentials/contributions.json \
            "$VERIFICATION_METHOD" "$CREATED" | tee validation.log

      # After signing, and reading the signed file rather than rebuilding it, so
      # the bytes in the image are the bytes that were proved.
      - name: Bake the badge image
        if: inputs.identity_only != true
        run: python3 -m pipeline.bake_badge

      # OB30Inspector is Open Badges 3.0 only and rejects a DomainLinkageCredential
      # out of hand, so the signer verifies its own fresh proof against the DID
      # document rendered above. Wrapping happens after: the proof covers the
      # credential, not the two-key resource DIF serves it inside.
      - name: Sign and verify domain linkage
        if: inputs.identity_only != true
        env:
          DID_ED25519_PRIVATE_B64: ${{ secrets.DID_ED25519_PRIVATE_B64 }}
        run: |
          . build/domain-linkage.env
          ./signer/build/install/signer/bin/signer \
            build/did-configuration.unsigned.json \
            build/did-configuration.signed.json \
            "$VERIFICATION_METHOD" "$CREATED" .well-known/did.json
          python3 -m pipeline.generate_domain_linkage \
            --wrap build/did-configuration.signed.json

      # identity_only exists for a key rotation. During one, nothing regenerates
      # the domain-linkage credential, so a stale expiry in it must not kill the
      # very run that publishes the new key.
      - name: Offline checks
        env:
          IDENTITY_ONLY: ${{ inputs.identity_only }}
        run: |
          python3 -m unittest discover -s pipeline
          if [ "$IDENTITY_ONLY" = "true" ]; then
            python3 -m pipeline.validate_endpoints --identity-only
          else
            python3 -m pipeline.validate_endpoints
          fi

      # Nothing is committed back. The endpoints are rebuilt from config.json and
      # the GitHub API on every run and deployed from the runner, so the repository
      # never carries one person's identity documents.
      - name: Stage site
        run: |
          mkdir -p _site
          for required in index.html humans.txt .nojekyll .well-known credentials; do
            cp -r "$required" _site/
          done
          find _site -type f | sort

      # include-hidden-files is not optional here. From v4 the action excludes
      # dotfiles, and every identity endpoint this site serves lives under
      # .well-known/ - without it the artifact deploys with did:web resolution
      # gone and only the post-deploy live check would notice.
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
          include-hidden-files: true

      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0

      - name: Verify what was published
        env:
          IDENTITY_ONLY: ${{ inputs.identity_only }}
        run: |
          if [ "$IDENTITY_ONLY" = "true" ]; then
            python3 -m pipeline.validate_endpoints --live --identity-only
          else
            python3 -m pipeline.validate_endpoints --live
          fi

      - name: Summary
        if: always()
        run: |
          {
            if [ "${{ inputs.identity_only }}" = "true" ]; then
              echo '> **Identity only.** did.json now announces the new key, but the'
              echo '> credentials still carry proofs made with the old one and will'
              echo '> not verify until you run this workflow again without the flag.'
              echo
            fi
            echo '### OB 3.0 validation'
            echo '```'
            tail -5 validation.log 2>/dev/null || echo '(credential not produced)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
